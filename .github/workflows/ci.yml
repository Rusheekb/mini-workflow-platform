name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege applies to CI too: this token can only read the repo.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, spec validation, tests, DAG integrity)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (pinned by Airflow's constraints file)
        run: pip install -r requirements.txt

      - name: Lint and format check
        run: |
          ruff check backend tests tasks
          ruff format --check backend tests tasks

      - name: Every committed spec must validate and generate
        run: |
          shopt -s nullglob
          for spec in specs/valid/*.yaml specs/submitted/*.yaml specs/demo/*.yaml; do
            python -m backend.generator "$spec" --out "$RUNNER_TEMP/dags-check"
          done

      - name: Tests (validator, generator, API, task storage, DAG integrity)
        run: pytest -v

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
