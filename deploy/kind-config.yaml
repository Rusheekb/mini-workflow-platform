# A one-node local Kubernetes cluster (the node is itself a Docker container).
#   kind create cluster --config deploy/kind-config.yaml
# One node keeps memory low on a laptop; a real cluster (EKS) has many nodes across availability zones.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mwp
nodes:
  - role: control-plane
